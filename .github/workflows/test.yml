name: Run tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    name: PHP${{matrix.php}} — L${{matrix.laravel}} — ${{matrix.stability}}

    strategy:
      matrix:
        laravel: [13.*, 12.*, 11.*, 10.*, 9.*, 8.*]
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # PHP 8.0 was not supported on initial Laravel 8 versions
          - laravel: 8.*
            stability: prefer-lowest
        # Each Laravel version runs prefer-lowest on its oldest
        # supported PHP and prefer-stable on its newest one.
        include:
          - { laravel: 13.*, stability: prefer-lowest, php: '8.3' }
          - { laravel: 13.*, stability: prefer-stable, php: '8.5' }
          - { laravel: 12.*, stability: prefer-lowest, php: '8.2' }
          - { laravel: 12.*, stability: prefer-stable, php: '8.5' }
          - { laravel: 11.*, stability: prefer-lowest, php: '8.2' }
          - { laravel: 11.*, stability: prefer-stable, php: '8.4' }
          - { laravel: 10.*, stability: prefer-lowest, php: '8.1' }
          - { laravel: 10.*, stability: prefer-stable, php: '8.3' }
          - { laravel: 9.*, stability: prefer-lowest, php: '8.0' }
          - { laravel: 9.*, stability: prefer-stable, php: '8.2' }
          - { laravel: 8.*, stability: prefer-stable, php: '8.0' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{matrix.php}}

      - name: Install dependencies
        run: |
            composer config policy.advisories.block false
            composer require "laravel/framework:${{ matrix.laravel }}" --no-update
            composer update --${{ matrix.stability }} --prefer-dist

      - name: Run tests
        run: composer test
